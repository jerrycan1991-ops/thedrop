# Local development data services.
#
# Requires Docker Desktop with the WSL2 backend. Nothing else in the repo needs Docker:
# typechecking, linting, unit tests and the Next.js build all run without it.
#
# Start:  docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
# Stop:   docker compose -f infrastructure/docker/docker-compose.dev.yml down
# Reset:  docker compose -f infrastructure/docker/docker-compose.dev.yml down -v
#         (-v drops the volume. Safe locally. NEVER on the VPS.)

name: thedrop-dev

services:
  postgres:
    # pgvector is preinstalled in this image, so the extension is a CREATE EXTENSION
    # away rather than a build step.
    image: pgvector/pgvector:pg16
    container_name: thedrop-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thedrop}
      POSTGRES_USER: ${POSTGRES_USER:-thedrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thedrop_dev}
    ports:
      # Loopback-bound even in development. A bare "5432:5432" would expose the
      # database to the local network, and the habit carries into production.
      - "127.0.0.1:5432:5432"
    volumes:
      - thedrop_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thedrop} -d ${POSTGRES_DB:-thedrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thedrop-dev-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-thedrop_dev}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - thedrop_dev_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-thedrop_dev} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thedrop_dev_pgdata:
  thedrop_dev_redis:
