# Production data services (VPS).
#
# ONLY Postgres and Redis run in Docker. The application processes -- Next.js, FastAPI
# and the Celery worker -- run natively under systemd (ADR-0002): no image build per
# deploy, ~200MB less overhead, and restarts measured in seconds.
#
# Start:
#   docker compose -f infrastructure/docker/docker-compose.yml \
#     --env-file /etc/thedrop/thedrop.env up -d

name: thedrop

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # CRITICAL: the 127.0.0.1 prefix is load-bearing. Docker publishes ports by
      # writing DOCKER-USER iptables rules that bypass UFW entirely, so a bare
      # "5432:5432" would expose this database to the internet despite the firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      - /var/lib/thedrop/pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=60
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /var/lib/thedrop/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
