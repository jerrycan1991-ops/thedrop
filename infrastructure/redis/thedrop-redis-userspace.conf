# THE DROP — Redis, run as an unprivileged user process.
#
# Installed to ~/.config/thedrop/redis.conf on a host where we have no root
# (ADR-0012). Started by PM2 from infrastructure/pm2/ecosystem.config.cjs, not systemd.
#
# This is a SECOND Redis on the host. CloudPanel runs its own on 6379 and that one is
# left alone: it is shared with PHP sites under an eviction policy, and this application
# keeps admin sessions and login rate-limit counters in Redis. An evicted rate-limit
# counter is a silently disabled safeguard.
#
# Nothing here needs privilege: 6380 is above 1024, and every path is under $HOME.

# ---------------------------------------------------------------- network
# Loopback only. Nothing outside the host reaches this instance, which is what makes a
# single password an adequate control.
bind 127.0.0.1
port 6380
protected-mode yes

# ---------------------------------------------------------------- auth
# MUST match REDIS_PASSWORD in the env file. deploy-userspace.sh compares them and
# refuses to run when they disagree, because the failure is otherwise diagnosed as a
# generic connection error.
#
# Set during setup; never committed.
# requirepass CHANGE_ME

# ---------------------------------------------------------------- memory
# Smaller than the 512mb the privileged deployment uses. Without systemd there is no
# MemoryMax backstop, and this box is already ~900MB into a 2GB swapfile, so the cap in
# this file is the ONLY thing bounding the dataset. Being conservative is deliberate.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------- persistence
# AOF so a restart does not drop every logged-in admin session and queued task.
# Paths are rewritten to absolute $HOME paths by the setup step.
appendonly yes
appendfsync everysec
dir ./

# ---------------------------------------------------------------- dangerous commands
# Renamed to the empty string, i.e. removed. A compromised app process should not be
# able to wipe the queue or rewrite the server's configuration at runtime.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# ---------------------------------------------------------------- process
# Foreground: PM2 owns the process and its restarts. Redis daemonising itself would
# fork away from PM2, which would then supervise a process that had already exited.
daemonize no
logfile ""
