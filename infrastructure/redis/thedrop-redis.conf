# THE DROP — dedicated Redis instance.
#
# Installed to /etc/thedrop/redis.conf, 0640 root:thedrop.
#
# This is a SECOND Redis on the host. The hosting panel runs its own on 6379 and that
# one is left alone: it is shared with PHP sites under an eviction policy, and this
# application keeps admin sessions and login rate-limit counters in Redis. An evicted
# rate-limit counter is a silently disabled safeguard.
#
# Mirrors the hardening the Docker image was given (ADR-0011).

# ---------------------------------------------------------------- network
# Loopback only. Nothing outside the host ever reaches this instance, which is what
# makes a single password an adequate control.
bind 127.0.0.1
port 6380
protected-mode yes

# ---------------------------------------------------------------- auth
# MUST match REDIS_PASSWORD in /etc/thedrop/thedrop.env. deploy.sh refuses to run if
# the two disagree, because the failure mode is otherwise a confusing connection error
# at the far end of a build.
#
# Set during provisioning; never committed. See docs/DEPLOYMENT.md §4.
# requirepass CHANGE_ME

# ---------------------------------------------------------------- memory
# 512 MB cap with LRU eviction, matching the container's limits. Sessions and rate
# limits are small; this headroom is for Celery payloads.
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------- persistence
# AOF so a restart does not drop every logged-in admin session and queued task.
appendonly yes
appendfsync everysec
dir /var/lib/thedrop/redis

# ---------------------------------------------------------------- dangerous commands
# Renamed to the empty string, i.e. removed. A compromised app process should not be
# able to wipe the queue or rewrite the server's configuration at runtime.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# ---------------------------------------------------------------- logging
# journald via stdout; the unit sets SyslogIdentifier.
logfile ""
daemonize no
