[project]
name = "thedrop"
version = "0.1.0"
description = "THE DROP - automated US news platform (Python services)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "thedrop-config",
    "thedrop-database",
    "thedrop-api",
    "thedrop-worker",
    "email-validator>=2.3.0",
]

[tool.uv.workspace]
members = [
    "packages/config",
    "packages/database",
    "packages/ingest",
    "services/api",
    "services/worker",
    # Runs on the desktop, not the VPS. Kept in the workspace so it shares the
    # lockfile and CI, but it deliberately does not depend on thedrop-database:
    # the desktop never holds database credentials (ADR-0001).
    "services/agent-runner",
]

[tool.uv.sources]
thedrop-config = { workspace = true }
thedrop-database = { workspace = true }
thedrop-ingest = { workspace = true }
thedrop-api = { workspace = true }
thedrop-worker = { workspace = true }
thedrop-agent-runner = { workspace = true }
# torch from NVIDIA's index below, not PyPI: the PyPI Windows wheel is CPU-only, so a
# plain install silently yields a runner that works and never touches the 4070 -- the
# kind of degradation that surfaces as "embeddings are slow" months later, if at all.
torch = { index = "pytorch-cu126" }

# `explicit = true` means ONLY packages that name this index use it; everything else
# resolves from PyPI as usual. The VPS is unaffected -- torch is reachable only through
# the `desktop-ml` group, which `uv sync --frozen` does not install (verified).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
# Desktop-only. The runner is a workspace MEMBER but nothing depends on it, and
# `uv sync` installs dependencies rather than members -- so it was resolved out of the
# venv by a later sync and the scheduled task died with "No module named agent".
#
# A group rather than a root dependency: adding it there would install the desktop
# runner on the VPS, which contradicts the whole point of ADR-0001. Install it with
# `uv sync --group desktop`, or let `uv run --group desktop` do it on demand.
desktop = ["thedrop-agent-runner"]

# The same runner WITH the embedding model stack (torch, several GB). Separate from
# `desktop` so that installing the runner does not silently pull a multi-gigabyte CUDA
# download onto a machine that only needs to claim jobs -- and so CI never does.
# The desktop that actually embeds uses this one:
#   uv sync --group desktop-ml
desktop-ml = ["thedrop-agent-runner[embeddings]"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migrations are machine output -- Alembic renders long `comment=` strings
# on one line. The bare "migrations/versions" pattern did not match the nested
# packages/database/... path, so they were being lint-gated by accident.
extend-exclude = [".venv", "**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"**/seed.py" = ["S106"]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "packages"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "db: requires a live PostgreSQL (skipped until Docker is available)",
    "redis: requires a live Redis (skipped until Docker is available)",
    "api: requires the FastAPI service running on 127.0.0.1:8000",
    "web: requires the Next.js service running on 127.0.0.1:3100",
    "integration: requires multiple live services",
    "gpu: runs the real embedding model (skipped without `uv sync --group desktop-ml`)",
]
filterwarnings = ["error::DeprecationWarning:thedrop.*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["migrations/versions"]
