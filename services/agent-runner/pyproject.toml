[project]
name = "thedrop-agent-runner"
version = "0.1.0"
description = "Desktop AI runner for THE DROP - claims leased jobs over HTTPS"
requires-python = ">=3.12,<3.14"

# Deliberately NOT thedrop-database.
#
# This package runs on the desktop, which never holds database credentials. Its only
# interface to the VPS is authenticated HTTPS to /api/v1/worker/* (ADR-0001), and
# SECURITY.md classifies it as semi-trusted because it executes model output. Adding a
# database dependency here would put a credential on the least-trusted machine we own.
dependencies = [
    "httpx>=0.28",
    # Response-schema validation for claim extraction (PIPELINE.md 10, SECURITY.md 6.3:
    # "schema validation ... invalid output is retried once, then fails"). Plain
    # pydantic, not pydantic-settings -- config.py's own docstring explains why this
    # runner avoids settings-management magic; validating a model's JSON output is a
    # different job from loading config, and needs no config-loading behavior at all.
    "pydantic>=2.9",
]

# An EXTRA, not a dependency. sentence-transformers pulls torch -- several gigabytes,
# and a CUDA build on this machine. A runner that only claims `noop` should not have to
# download it, and CI should not either.
#
# Absence is handled, not an error: `agent.embedding.is_available()` probes for it and
# the `embed_articles` handler unregisters itself when it is missing, so the runner
# advertises only what it can actually do and the API never leases embedding work to a
# desktop that cannot perform it (ADR-0005).
#
# For GPU wheels rather than the CPU default, install torch first from the CUDA index:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    # torch is listed explicitly even though sentence-transformers pulls it in. A
    # `tool.uv.sources` override only applies to a dependency the workspace itself
    # DECLARES -- as a purely transitive dependency, torch resolved from PyPI and
    # installed the CPU build, on a machine bought for its GPU, reporting success.
    "torch>=2.4",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
