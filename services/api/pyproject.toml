[project]
name = "thedrop-api"
version = "0.1.0"
description = "FastAPI service for THE DROP - public, admin and worker APIs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "thedrop-config",
    "thedrop-database",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
]

[tool.uv.sources]
thedrop-config = { workspace = true }
thedrop-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
