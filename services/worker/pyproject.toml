[project]
name = "thedrop-worker"
version = "0.1.0"
description = "Celery worker for THE DROP - VPS-local tasks only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "thedrop-config",
    "thedrop-database",
    "thedrop-ingest",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
]

[tool.uv.sources]
thedrop-config = { workspace = true }
thedrop-database = { workspace = true }
thedrop-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
