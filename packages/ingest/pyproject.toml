[project]
name = "thedrop-ingest"
version = "0.1.0"
description = "Ingestion for THE DROP: providers, normalization, cheap deduplication"
requires-python = ">=3.12,<3.14"

# `normalize` and `dedup` are pure and stdlib-only, and are tested without a database
# or a network. `providers` adds httpx; `pipeline` adds the database. The split is
# deliberate: the logic most worth testing exhaustively is the logic with no I/O.
#
# This is the VPS half of ingestion (PIPELINE.md 3-4): canonical URLs, hostile-text
# handling, injection scanning, SimHash. It runs on a 4-core box shared with a hosting
# panel and must finish in single-digit milliseconds, which is the whole reason
# embeddings and clustering live on the desktop (ADR-0005).
#
# It lives in packages/ rather than services/worker/app/ for two reasons: it has no
# Celery or database dependency and is useful anywhere, and services/api and
# services/worker BOTH ship a top-level `app` package, so anything importable from
# inside one of them collides with the other the moment a test imports both.
#
# Feed parsing uses stdlib xml.etree rather than feedparser: RSS and Atom are simple
# enough that a dependency buys little, and this box has 8GB shared with a hosting
# panel. See providers/rss.py for how the XML attack surface is closed without
# defusedxml.
dependencies = [
    "httpx>=0.28",
    "thedrop-database",
]

[tool.uv.sources]
thedrop-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thedrop_ingest"]
