[project]
name = "thedrop-config"
version = "0.1.0"
description = "Typed settings, editorial thresholds and feature flags for THE DROP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thedrop_config"]
