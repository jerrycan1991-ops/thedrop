[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

# The URL is supplied at runtime from settings (env.py). It is NOT stored here --
# this file is committed and must never contain a credential.
sqlalchemy.url =

[post_write_hooks]
# `exec`, not `console_scripts`. Ruff ships a compiled binary rather than a Python
# console_scripts entry point, so Alembic cannot import it -- it fails the whole
# revision command with "Could not find entrypoint console_scripts.ruff" AFTER
# writing the file, which looks like the generation failed when it did not.
# Running it as a subprocess resolves `ruff` from the active venv's PATH.
hooks = ruff_format, ruff_fix

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
