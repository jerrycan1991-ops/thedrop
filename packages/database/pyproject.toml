[project]
name = "thedrop-database"
version = "0.1.0"
description = "SQLAlchemy models and Alembic migrations for THE DROP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "thedrop-config",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
]

[tool.uv.sources]
thedrop-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thedrop_database"]
